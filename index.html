<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mutaz LED Neon Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Cairo', 'Inter', system-ui, sans-serif; 
            touch-action: none;
            overscroll-behavior: none;
        }
        .glass { 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(20px); 
        }

        /* Bottom Sheet */
        #bottom-sheet {
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            touch-action: none;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
        }
        #sheet-handle {
            width: 48px;
            height: 5px;
            background: rgba(255,255,255,0.35);
            border-radius: 9999px;
        }

        #splash-screen { transition: opacity 1.5s ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 overflow-hidden">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 z-[200] flex items-center justify-center bg-black">
        <canvas id="splash-canvas" class="absolute inset-0"></canvas>
        <div class="relative z-10 text-center">
            <h1 class="text-6xl md:text-7xl font-black tracking-widest bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-300 bg-clip-text text-transparent">
                MUTAZ
            </h1>
            <p class="text-2xl text-amber-400 mt-3 tracking-wide" id="splash-subtitle">LED NEON STUDIO</p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden flex flex-col h-screen">

        <!-- Top Header -->
        <header class="bg-slate-900 border-b border-slate-700 h-16 flex items-center px-5 fixed top-0 left-0 right-0 z-50">
            <div class="flex items-center justify-between w-full">
                <h1 id="app-title" class="text-2xl font-bold">Mutaz <span class="text-cyan-400">LED Neon</span></h1>
                
                <div class="flex items-center gap-4">
                    <button id="lang-toggle" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-2xl font-medium">
                        <span id="current-lang">EN</span>
                    </button>
                    <button id="btn-download-dxf" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-2.5 rounded-2xl font-bold">
                        تحميل DXF
                    </button>
                </div>
            </div>
        </header>

        <!-- Preview Area -->
        <div class="flex-1 pt-16 pb-28 overflow-auto" id="preview-area">
            <div class="p-4 space-y-6">
                <div>
                    <h3 id="preview2d-title" class="text-lg mb-3">معاينة 2D</h3>
                    <div class="bg-white rounded-3xl p-4 shadow-inner">
                        <canvas id="main-canvas" width="800" height="460" class="mx-auto rounded-2xl"></canvas>
                    </div>
                </div>

                <div>
                    <h3 id="preview3d-title" class="text-lg mb-3">معاينة ثلاثية الأبعاد</h3>
                    <div id="three-container" class="w-full h-[380px] bg-black rounded-3xl overflow-hidden"></div>
                </div>
            </div>
        </div>

        <!-- Draggable Bottom Sheet -->
        <div id="bottom-sheet" class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-600 rounded-t-3xl glass z-50">
            <!-- Handle -->
            <div class="flex justify-center pt-3 pb-1">
                <div id="sheet-handle" class="cursor-grab active:cursor-grabbing"></div>
            </div>

            <div class="px-6 pb-8 overflow-auto" style="max-height: calc(85vh - 60px);">
                <h2 id="settings-title" class="text-xl font-semibold text-cyan-300 mb-6">إعدادات التصميم</h2>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="font-label">رفع خط مخصص (TTF/OTF)</label>
                        <input type="file" id="font-upload" accept=".ttf,.otf" class="w-full text-sm">
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="text-label">النص (عربي / إنجليزي)</label>
                        <textarea id="text-input" rows="3" class="w-full p-4 rounded-2xl bg-slate-800 border border-slate-600 focus:border-cyan-400 text-lg" dir="rtl">معتز</textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1" id="width-label">العرض (سم)</label>
                            <input type="number" id="width-cm" value="100" step="5" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1" id="height-label">الارتفاع (سم)</label>
                            <input type="number" id="height-cm" value="60" step="5" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1" id="hole-radius-label">قطر الثقب (مم)</label>
                            <input type="number" id="hole-radius" value="3" step="0.2" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1" id="hole-spacing-label">التباعد (مم)</label>
                            <input type="number" id="hole-spacing" value="15" step="1" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="edge-offset-label">المسافة من الحافة (مم)</label>
                        <input type="number" id="edge-offset" value="4" step="0.5" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="led-color-label">لون الـ LED</label>
                        <input type="color" id="led-color" value="#00ffff" class="w-full h-12 rounded-2xl cursor-pointer">
                    </div>

                    <button id="btn-process" class="w-full bg-cyan-600 hover:bg-cyan-500 py-4 rounded-2xl font-bold text-lg mt-6">
                        تحديث المعاينة
                    </button>

                    <div id="progress-container" class="hidden">
                        <div class="flex justify-between text-xs mb-2">
                            <span id="progress-label">جارٍ المعالجة...</span>
                            <span id="progress-percent">0%</span>
                        </div>
                        <div class="h-2.5 bg-slate-700 rounded-full">
                            <div id="progress-fill" class="h-full bg-cyan-400 rounded-full w-0 transition-all"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js for Splash -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script type="module" src="js/main.js"></script>

    <script>
        // ====================== SPLASH SCREEN ======================
        let scene, camera, renderer, particles, time = 0;

        function initSplash() {
            const canvas = document.getElementById('splash-canvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 42;

            scene.add(new THREE.AmbientLight(0xaaaaaa, 0.7));
            const light = new THREE.PointLight(0xffdd88, 3.5, 100);
            light.position.set(10, 25, 35);
            scene.add(light);

            // Glowing Neon Circles
            const count = 1600;
            const pos = new Float32Array(count * 3);
            const col = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                const r = 28 + Math.random() * 38;
                const a = Math.random() * Math.PI * 2;
                pos[i]     = Math.cos(a) * r;
                pos[i+1]   = (Math.random() - 0.5) * 55;
                pos[i+2]   = Math.sin(a) * r;

                col[i]     = 1.0;
                col[i+1]   = 0.78 + Math.random() * 0.22;
                col[i+2]   = 0.35 + Math.random() * 0.45;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

            particles = new THREE.Points(geo, new THREE.PointsMaterial({
                size: 0.72,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthTest: false
            }));

            scene.add(particles);
            animateSplash();
        }

        function animateSplash() {
            requestAnimationFrame(animateSplash);
            time += 0.009;
            particles.rotation.y = time * 0.18;
            renderer.render(scene, camera);
        }

        // ====================== BOTTOM SHEET DRAG (محسّن للموبايل) ======================
        function setupBottomSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const handle = document.getElementById('sheet-handle');
            let startY = 0;
            let currentTranslate = 0;
            let isDragging = false;

            const toggleSheet = () => {
                currentTranslate = currentTranslate === 0 ? -68 : 0;
                sheet.style.transform = `translateY(${currentTranslate}%)`;
            };

            handle.addEventListener('click', toggleSheet);

            // Touch Events
            handle.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                isDragging = true;
                sheet.style.transition = 'none';
            });

            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const diff = e.touches[0].clientY - startY;
                let newTranslate = currentTranslate + (diff / window.innerHeight) * 120;
                newTranslate = Math.max(-85, Math.min(0, newTranslate));
                sheet.style.transform = `translateY(${newTranslate}%)`;
            });

            document.addEventListener('touchend', (e) => {
                if (!isDragging) return;
                isDragging = false;
                sheet.style.transition = 'transform 0.35s cubic-bezier(0.32, 0.72, 0, 1)';

                const currentPos = parseFloat(sheet.style.transform.replace(/[^0-9.-]/g, '')) || 0;
                
                if (currentPos < -35) {
                    currentTranslate = -68;
                } else {
                    currentTranslate = 0;
                }
                sheet.style.transform = `translateY(${currentTranslate}%)`;
            });
        }

        // ====================== Language System ======================
        let currentLang = 'ar';

        const translations = {
            ar: {
                appTitle: "Mutaz LED Neon",
                splashSubtitle: "LED NEON STUDIO",
                settingsTitle: "إعدادات التصميم",
                fontLabel: "رفع خط مخصص (TTF/OTF)",
                textLabel: "النص (عربي / إنجليزي)",
                widthLabel: "العرض (سم)",
                heightLabel: "الارتفاع (سم)",
                holeRadiusLabel: "قطر الثقب (مم)",
                holeSpacingLabel: "التباعد (مم)",
                edgeOffsetLabel: "المسافة من الحافة (مم)",
                ledColorLabel: "لون الـ LED",
                preview2d: "معاينة 2D",
                preview3d: "معاينة ثلاثية الأبعاد",
                downloadText: "تحميل DXF"
            },
            en: {
                appTitle: "Mutaz LED Neon",
                splashSubtitle: "LED NEON STUDIO",
                settingsTitle: "Design Settings",
                fontLabel: "Upload Custom Font (TTF/OTF)",
                textLabel: "Text (Arabic / English)",
                widthLabel: "Width (cm)",
                heightLabel: "Height (cm)",
                holeRadiusLabel: "Hole Diameter (mm)",
                holeSpacingLabel: "Spacing (mm)",
                edgeOffsetLabel: "Edge Offset (mm)",
                ledColorLabel: "LED Color",
                preview2d: "2D Preview",
                preview3d: "3D Preview",
                downloadText: "Download DXF"
            }
        };

        function switchLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            
            const t = translations[currentLang];
            document.getElementById('current-lang').textContent = currentLang.toUpperCase();
            document.getElementById('app-title').innerHTML = `${t.appTitle} <span class="text-cyan-400">LED Neon</span>`;
            document.getElementById('splash-subtitle').textContent = t.splashSubtitle;
            document.getElementById('settings-title').textContent = t.settingsTitle;
            document.getElementById('font-label').textContent = t.fontLabel;
            document.getElementById('text-label').textContent = t.textLabel;
            document.getElementById('width-label').textContent = t.widthLabel;
            document.getElementById('height-label').textContent = t.heightLabel;
            document.getElementById('hole-radius-label').textContent = t.holeRadiusLabel;
            document.getElementById('hole-spacing-label').textContent = t.holeSpacingLabel;
            document.getElementById('edge-offset-label').textContent = t.edgeOffsetLabel;
            document.getElementById('led-color-label').textContent = t.ledColorLabel;
            document.getElementById('preview2d-title').textContent = t.preview2d;
            document.getElementById('preview3d-title').textContent = t.preview3d;
            document.getElementById('btn-download-dxf').textContent = t.downloadText;
        }

        // ====================== Initialization ======================
        window.addEventListener('load', () => {
            initSplash();

            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    setupBottomSheet();
                }, 800);
            }, 2400);

            document.getElementById('lang-toggle').addEventListener('click', switchLanguage);
        });

        // Resize
        window.addEventListener('resize', () => {
            if (renderer && camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
