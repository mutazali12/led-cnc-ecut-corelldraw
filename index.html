<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mutaz LED Neon Pro | شبكة متعرجة 45°</title>
    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-clipper@1.0.1/clipper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', 'Inter', system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
            touch-action: pan-y pinch-zoom; /* يسمح بالسحب العمودي ولا يتعارض */
        }
        .glass {
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(71, 85, 105, 0.6);
        }
        #bottom-sheet {
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            will-change: transform;
            box-shadow: 0 -12px 40px rgba(0,0,0,0.6);
        }
        #sheet-handle {
            width: 48px;
            height: 5px;
            background: rgba(255,255,255,0.35);
            border-radius: 10px;
            margin: 0 auto;
            cursor: grab;
            transition: background 0.2s;
        }
        #sheet-handle:active {
            cursor: grabbing;
            background: #22d3ee;
        }
        canvas#main-canvas {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 35px -10px black;
            width: 100%;
            height: auto;
        }
        #three-container {
            background: #030712;
            border-radius: 1.5rem;
            overflow: hidden;
            position: relative;
        }
        input, textarea, select {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 1rem;
            padding: 0.7rem 1rem;
            color: #f1f5f9;
            width: 100%;
            transition: 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #22d3ee;
            outline: none;
            box-shadow: 0 0 0 2px rgba(34,211,238,0.2);
        }
        button:active {
            transform: scale(0.97);
        }
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            display: none;
            z-index: 25;
            white-space: nowrap;
        }
        /* tiny scroll inside sheet */
        .sheet-scroll {
            max-height: calc(82vh - 80px);
            overflow-y: auto;
            padding-bottom: 20px;
        }
        @media (max-width: 640px) {
            .sheet-scroll { max-height: calc(78vh - 70px); }
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- SPLASH SCREEN بسيط (بدون ثري دي تجنبا للثقيل) -->
    <div id="splash-screen" class="fixed inset-0 z-[200] flex items-center justify-center bg-black transition-opacity duration-1000">
        <div class="text-center">
            <h1 class="text-6xl md:text-7xl font-black tracking-widest bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-300 bg-clip-text text-transparent">MUTAZ</h1>
            <p class="text-2xl text-amber-400 mt-3">LED NEON STUDIO</p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden flex flex-col h-screen">
        <!-- Header -->
        <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-700 h-16 flex items-center justify-between px-5 fixed top-0 left-0 right-0 z-50">
            <h1 class="text-2xl font-bold">Mutaz <span class="text-cyan-400">LED Neon</span></h1>
            <button id="btn-3d-reset" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-full transition">reset camera</button>
        </header>

        <!-- Preview scrollable area -->
        <div class="flex-1 pt-16 pb-28 overflow-auto p-4 space-y-6" id="preview-area">
            <!-- 2D preview -->
            <div>
                <h3 class="text-lg mb-2 flex items-center gap-2">📐 معاينة 2D <span class="text-cyan-400 text-xs">(شبكة متعرجة 45°)</span></h3>
                <div class="bg-white/5 rounded-2xl p-3">
                    <canvas id="main-canvas" width="800" height="460" class="mx-auto w-full h-auto rounded-2xl shadow-2xl"></canvas>
                </div>
            </div>
            <!-- 3D preview -->
            <div>
                <h3 class="text-lg mb-2">🎮 معاينة ثلاثية الأبعاد <span class="text-xs text-slate-400">(اسحب بالماوس/الإصبع)</span></h3>
                <div id="three-container" class="w-full h-80 md:h-96 bg-black rounded-2xl overflow-hidden relative">
                    <div id="three-loader" class="loader">تحميل المشهد ثلاثي الأبعاد...</div>
                </div>
            </div>
            <!-- Download button -->
            <div class="flex justify-center py-3">
                <button id="btn-download-dxf" class="bg-emerald-600 hover:bg-emerald-500 px-8 py-4 rounded-2xl font-bold flex items-center gap-3 shadow-xl active:scale-95 transition">
                    ⬇️ تحميل DXF (CNC / راوتر)
                </button>
            </div>
        </div>

        <!-- BOTTOM SHEET (مع إصلاح كامل للفتح والإغلاق) -->
        <div id="bottom-sheet" class="fixed bottom-0 left-0 right-0 glass rounded-t-3xl z-50" style="transform: translateY(70%);">
            <!-- Header of Sheet -->
            <div class="flex items-center justify-between px-6 pt-4 pb-2">
                <button id="btn-close-sheet" class="text-3xl text-slate-400 hover:text-white transition w-10 h-10 flex items-center justify-center rounded-full">✕</button>
                <div id="sheet-handle"></div>
                <button id="btn-open-sheet" class="text-3xl text-cyan-400 hover:text-cyan-300 transition w-10 h-10 flex items-center justify-center rounded-full">⚙️</button>
            </div>
            <!-- Content scroll -->
            <div class="sheet-scroll px-6">
                <h2 class="text-xl font-bold text-cyan-300 mb-5">⚙️ إعدادات التصميم</h2>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">📁 رفع خط مخصص (TTF/OTF)</label>
                        <input type="file" id="font-upload" accept=".ttf,.otf">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">✍️ النص (عربي / إنجليزي)</label>
                        <textarea id="text-input" rows="2" class="text-right" dir="auto">معتز LED</textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label>📏 العرض (سم)</label><input type="number" id="width-cm" value="110" step="5"></div>
                        <div><label>📐 الارتفاع (سم)</label><input type="number" id="height-cm" value="70" step="5"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label>🔘 قطر الثقب (مم)</label><input type="number" id="hole-radius" value="3.8" step="0.2"></div>
                        <div><label>📏 التباعد (مم)</label><input type="number" id="hole-spacing" value="14" step="1"></div>
                    </div>
                    <div>
                        <label>📏 المسافة من حافة الحرف (مم)</label>
                        <input type="number" id="edge-offset" value="4.5" step="0.5">
                    </div>
                    <div>
                        <label>🎨 لون الـ LED (نيون)</label>
                        <input type="color" id="led-color" value="#00f5ff">
                    </div>
                    <button id="btn-process" class="w-full bg-cyan-600 hover:bg-cyan-500 py-4 rounded-2xl font-bold text-lg mt-3 transition active:scale-95">
                        ✨ توليد / تحديث المعاينة
                    </button>
                </div>
                <div id="status-msg" class="text-sm text-center mt-5 text-slate-300 pb-6"></div>
            </div>
        </div>
    </div>

    <script>
        (function(){
            // ------------------------------ GLOBALS ------------------------------
            let currentFont = null;
            let computedHoles = [];
            let textOutlinePathsCm = [];
            let scene3d, camera3d, renderer3d, controls3d, acrylicMesh, ledPointsMesh, pointLight;
            let threeContainer = document.getElementById('three-container');
            let mainCanvas = document.getElementById('main-canvas');
            let ctx = mainCanvas.getContext('2d');
            let computationCache = new Map();

            // DOM elements
            const textInput = document.getElementById('text-input');
            const widthInput = document.getElementById('width-cm');
            const heightInput = document.getElementById('height-cm');
            const radiusInput = document.getElementById('hole-radius');
            const spacingInput = document.getElementById('hole-spacing');
            const edgeOffsetInput = document.getElementById('edge-offset');
            const ledColorInput = document.getElementById('led-color');
            const btnProcess = document.getElementById('btn-process');
            const btnDownload = document.getElementById('btn-download-dxf');
            const fontUpload = document.getElementById('font-upload');
            const statusMsg = document.getElementById('status-msg');
            const threeLoader = document.getElementById('three-loader');

            // ------------------------------ THREE.JS (مع reset) ------------------------------
            function initThree() {
                if (!threeContainer) return;
                if (threeLoader) threeLoader.style.display = 'flex';
                scene3d = new THREE.Scene();
                scene3d.background = new THREE.Color(0x050b1a);
                scene3d.add(new THREE.AmbientLight(0x404060, 1.4));
                const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
                dirLight.position.set(40, 60, 30);
                scene3d.add(dirLight);
                camera3d = new THREE.PerspectiveCamera(48, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1200);
                camera3d.position.set(55, 38, 85);
                renderer3d = new THREE.WebGLRenderer({ antialias: true });
                renderer3d.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
                threeContainer.appendChild(renderer3d.domElement);
                controls3d = new THREE.OrbitControls(camera3d, renderer3d.domElement);
                controls3d.enableDamping = true;
                controls3d.dampingFactor = 0.07;
                controls3d.rotateSpeed = 1.2;
                controls3d.zoomSpeed = 1.0;
                controls3d.target.set(0, 0, 0);
                function animate() {
                    requestAnimationFrame(animate);
                    controls3d.update();
                    if (pointLight) pointLight.intensity = 9 + Math.sin(Date.now() * 0.005) * 2.2;
                    renderer3d.render(scene3d, camera3d);
                }
                animate();
                if (threeLoader) threeLoader.style.display = 'none';
                window.addEventListener('resize', () => {
                    if (!threeContainer) return;
                    const w = threeContainer.clientWidth, h = threeContainer.clientHeight;
                    camera3d.aspect = w / h;
                    camera3d.updateProjectionMatrix();
                    renderer3d.setSize(w, h);
                });
            }

            function resetThreeCamera() {
                if (camera3d && controls3d) {
                    camera3d.position.set(55, 38, 85);
                    controls3d.target.set(0, 0, 0);
                    controls3d.update();
                }
            }

            function updateThreePreview(wCm, hCm, holes, holeRadMm, ledColorHex, outlinesCm) {
                if (!scene3d) return;
                if (acrylicMesh) scene3d.remove(acrylicMesh);
                if (ledPointsMesh) scene3d.remove(ledPointsMesh);
                if (pointLight) scene3d.remove(pointLight);
                const thickness = 0.7;
                const r3d = holeRadMm / 10;
                const color = new THREE.Color(ledColorHex);
                const shape = new THREE.Shape();
                shape.moveTo(0, 0); shape.lineTo(wCm, 0); shape.lineTo(wCm, hCm); shape.lineTo(0, hCm); shape.closePath();
                holes.slice(0, 2000).forEach(h => {
                    const hp = new THREE.Path();
                    hp.absarc(h.x, hCm - h.y, r3d, 0, Math.PI * 2, true);
                    shape.holes.push(hp);
                });
                const extrudeSet = { depth: thickness, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2 };
                const geom = new THREE.ExtrudeGeometry(shape, extrudeSet);
                const material = new THREE.MeshPhysicalMaterial({ color: 0xf8fafc, metalness: 0.06, roughness: 0.1, transmission: 0.82, opacity: 0.38, transparent: true });
                acrylicMesh = new THREE.Mesh(geom, material);
                acrylicMesh.position.set(-wCm / 2, -hCm / 2, -thickness / 2);
                scene3d.add(acrylicMesh);
                // خطوط بيضاء للإطار (اختياري)
                if (outlinesCm && outlinesCm.length) {
                    const group = new THREE.Group();
                    outlinesCm.forEach(path => {
                        if (path.length < 2) return;
                        const pts = path.map(p => new THREE.Vector3(p.x - wCm / 2, hCm - p.y - hCm / 2, thickness / 2 + 0.03));
                        const lineGeom = new THREE.BufferGeometry().setFromPoints(pts);
                        group.add(new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0xcbd5e1 })));
                    });
                    scene3d.add(group);
                }
                if (holes.length) {
                    const pointsPos = holes.map(h => new THREE.Vector3(h.x - wCm / 2, hCm - h.y - hCm / 2, -thickness / 2 - 0.12));
                    const ptsGeom = new THREE.BufferGeometry().setFromPoints(pointsPos);
                    const ptsMat = new THREE.PointsMaterial({ color, size: r3d * 2.8, transparent: true, blending: THREE.AdditiveBlending });
                    ledPointsMesh = new THREE.Points(ptsGeom, ptsMat);
                    scene3d.add(ledPointsMesh);
                    pointLight = new THREE.PointLight(color, 11, Math.max(wCm, hCm) * 2.2);
                    pointLight.position.set(0, 0, -thickness - 0.1);
                    scene3d.add(pointLight);
                }
                const maxDim = Math.max(wCm, hCm);
                const dist = maxDim / (2 * Math.tan(48 * Math.PI / 360)) + 18;
                camera3d.position.set(wCm * 0.3, hCm * 0.18, dist);
                camera3d.lookAt(0, 0, 0);
                controls3d.target.set(0, 0, 0);
                controls3d.update();
            }

            // ----------------------------- EXTRACT OUTLINES (helper) -----------------------------
            function extractRawOutlines(font, text, fontSize) {
                const path = font.getPath(text, 0, 0, fontSize);
                const outlines = [];
                let current = [];
                let pos = { x: 0, y: 0 };
                for (let cmd of path.commands) {
                    if (cmd.type === 'M') {
                        if (current.length) outlines.push(current);
                        current = [{ x: cmd.x, y: cmd.y }];
                        pos = { x: cmd.x, y: cmd.y };
                    } else if (cmd.type === 'L') {
                        current.push({ x: cmd.x, y: cmd.y });
                        pos = { x: cmd.x, y: cmd.y };
                    } else if (cmd.type === 'C') {
                        for (let t = 0.04; t <= 1; t += 0.04) {
                            const x = (1 - t) ** 3 * pos.x + 3 * (1 - t) ** 2 * t * cmd.x1 + 3 * (1 - t) * t ** 2 * cmd.x2 + t ** 3 * cmd.x;
                            const y = (1 - t) ** 3 * pos.y + 3 * (1 - t) ** 2 * t * cmd.y1 + 3 * (1 - t) * t ** 2 * cmd.y2 + t ** 3 * cmd.y;
                            current.push({ x, y });
                        }
                        pos = { x: cmd.x, y: cmd.y };
                    } else if (cmd.type === 'Z') {
                        if (current.length) outlines.push(current);
                        current = [];
                    }
                }
                if (current.length) outlines.push(current);
                return outlines;
            }

            // ----------------------------- الخوارزمية الأساسية: شبكة متعرجة 45 درجة داخل الحروف -----------------------------
            async function generateStaggeredGridHoles(text, wCm, hCm, spacingMm, radiusMm, edgeMm) {
                if (!currentFont) return [];
                const scale = 5; // px/cm
                const w = Math.round(wCm * scale);
                const h = Math.round(hCm * scale);
                mainCanvas.width = w; mainCanvas.height = h;
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);

                let fontSize = w / (text.length * 0.7);
                fontSize = Math.min(fontSize, h * 0.82);
                fontSize = Math.max(fontSize, 12);
                const testPath = currentFont.getPath(text, 0, 0, fontSize);
                const box = testPath.getBoundingBox();
                const offX = w / 2 - (box.x1 + (box.x2 - box.x1) / 2);
                const offY = h / 2 - (box.y1 + (box.y2 - box.y1) / 2);
                // مسارات خارجية للإطار
                const rawOutlines = extractRawOutlines(currentFont, text, fontSize);
                textOutlinePathsCm = rawOutlines.map(cont => cont.map(p => ({ x: (p.x + offX) / scale, y: (p.y + offY) / scale })));

                // قناع كامل للحرف (أبيض على أسود)
                const maskCanvas = document.createElement('canvas'); maskCanvas.width = w; maskCanvas.height = h;
                const mCtx = maskCanvas.getContext('2d');
                mCtx.fillStyle = '#000000'; mCtx.fillRect(0, 0, w, h);
                mCtx.translate(offX, offY);
                const fillPath = currentFont.getPath(text, 0, 0, fontSize);
                fillPath.fill = '#ffffff';
                fillPath.draw(mCtx);
                mCtx.setTransform(1, 0, 0, 1, 0, 0);

                // قناع داخلي مع إزاحة الحافة
                const edgePx = edgeMm * scale / 10;
                const insetCanvas = document.createElement('canvas');
                insetCanvas.width = Math.max(1, w - 2 * edgePx);
                insetCanvas.height = Math.max(1, h - 2 * edgePx);
                const iCtx = insetCanvas.getContext('2d');
                iCtx.fillStyle = '#000000'; iCtx.fillRect(0, 0, insetCanvas.width, insetCanvas.height);
                iCtx.translate(offX - edgePx, offY - edgePx);
                fillPath.fill = '#ffffff';
                fillPath.draw(iCtx);
                iCtx.setTransform(1, 0, 0, 1, 0, 0);

                const insetData = iCtx.getImageData(0, 0, insetCanvas.width, insetCanvas.height).data;
                const stepPx = Math.max(2, Math.floor(spacingMm * scale / 10));
                const halfStep = stepPx / 2;
                const holes = [];
                for (let y = stepPx; y < h; y += stepPx) {
                    const rowOffset = (Math.floor(y / stepPx) % 2 === 0) ? 0 : halfStep;
                    for (let x = rowOffset; x < w; x += stepPx) {
                        const ix = Math.round(x - edgePx);
                        const iy = Math.round(y - edgePx);
                        if (ix >= 0 && ix < insetCanvas.width && iy >= 0 && iy < insetCanvas.height) {
                            const idx = (iy * insetCanvas.width + ix) * 4;
                            if (insetData[idx + 3] > 128) {
                                holes.push({ x: x / scale, y: y / scale, cx: x, cy: y });
                            }
                        }
                    }
                }
                // رسم النص الأصلي (للمعاينة)
                ctx.fillStyle = '#111827';
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(text, w / 2, h / 2);
                const radPx = radiusMm * scale / 10;
                const ledColor = ledColorInput.value;
                holes.forEach(h => {
                    ctx.beginPath();
                    ctx.arc(h.cx, h.cy, radPx, 0, Math.PI * 2);
                    ctx.fillStyle = ledColor;
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.4;
                    ctx.stroke();
                });
                return holes;
            }

            // ----------------------------- المعالجة الرئيسية -----------------------------
            async function processDesign() {
                if (!currentFont) {
                    statusMsg.innerText = "⚠️ انتظر تحميل الخط أو ارفع خطاً مخصصاً (TTF/OTF)";
                    return;
                }
                const start = performance.now();
                btnProcess.disabled = true;
                statusMsg.innerText = "⌛ جاري توليد الشبكة المتعرجة...";
                const text = textInput.value.trim() || "Mutaz";
                const wCm = parseFloat(widthInput.value) || 110;
                const hCm = parseFloat(heightInput.value) || 70;
                const rad = parseFloat(radiusInput.value) || 3.8;
                const spacing = parseFloat(spacingInput.value) || 14;
                const edge = parseFloat(edgeOffsetInput.value) || 4.5;
                const cacheKey = `${text}|${wCm}|${hCm}|${rad}|${spacing}|${edge}|${currentFont.names?.fontFamily?.en || 'font'}`;
                if (computationCache.has(cacheKey)) {
                    const cached = computationCache.get(cacheKey);
                    computedHoles = cached.holes;
                    textOutlinePathsCm = cached.outlines;
                    redrawCanvas2D(computedHoles, wCm, hCm, rad);
                    updateThreePreview(wCm, hCm, computedHoles, rad, ledColorInput.value, textOutlinePathsCm);
                    statusMsg.innerText = `✅ ${computedHoles.length} ثقب (مخبأ) – شبكة متعرجة`;
                    btnProcess.disabled = false;
                    return;
                }
                computedHoles = await generateStaggeredGridHoles(text, wCm, hCm, spacing, rad, edge);
                redrawCanvas2D(computedHoles, wCm, hCm, rad);
                updateThreePreview(wCm, hCm, computedHoles, rad, ledColorInput.value, textOutlinePathsCm);
                if (computationCache.size > 18) computationCache.delete(computationCache.keys().next().value);
                computationCache.set(cacheKey, { holes: computedHoles, outlines: textOutlinePathsCm });
                const elapsed = ((performance.now() - start) / 1000).toFixed(2);
                statusMsg.innerText = `✨ ${computedHoles.length} ثقب – شبكة مائلة 45° (${elapsed} ث)`;
                btnProcess.disabled = false;
            }

            function redrawCanvas2D(holes, wCm, hCm, holeRadMm) {
                const scale = 5;
                const w = wCm * scale, h = hCm * scale;
                mainCanvas.width = w; mainCanvas.height = h;
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
                if (textOutlinePathsCm && textOutlinePathsCm.length) {
                    ctx.save();
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 1.6;
                    textOutlinePathsCm.forEach(path => {
                        if (path.length < 2) return;
                        ctx.beginPath();
                        ctx.moveTo(path[0].x * scale, path[0].y * scale);
                        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x * scale, path[i].y * scale);
                        ctx.stroke();
                    });
                    ctx.restore();
                }
                const rPx = holeRadMm * scale / 10;
                const led = ledColorInput.value;
                holes.forEach(h => {
                    ctx.beginPath();
                    ctx.arc(h.cx, h.cy, rPx, 0, Math.PI * 2);
                    ctx.fillStyle = led;
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.4;
                    ctx.stroke();
                });
            }

            // ----------------------------- DXF Export -----------------------------
            function downloadDXF() {
                if (!computedHoles.length) { alert("لا توجد ثقوب لتصديرها ، اضغط تحديث أولاً"); return; }
                const wCm = parseFloat(widthInput.value) || 110;
                const hCm = parseFloat(heightInput.value) || 70;
                const rad = parseFloat(radiusInput.value) || 3.8;
                const textName = textInput.value.trim().replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '_') || 'Design';
                const wMm = (wCm * 10).toFixed(3);
                const hMm = (hCm * 10).toFixed(3);
                let dxf = `999\nMutaz LED Neon Pro\n0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1021\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n`;
                dxf += `0\nLWPOLYLINE\n8\nBOARD\n90\n4\n70\n1\n10\n0\n20\n0\n10\n${wMm}\n20\n0\n10\n${wMm}\n20\n${hMm}\n10\n0\n20\n${hMm}\n`;
                computedHoles.forEach(h => {
                    const x = (h.x * 10).toFixed(4);
                    const y = (hMm - h.y * 10).toFixed(4);
                    dxf += `0\nCIRCLE\n8\nHOLES\n10\n${x}\n20\n${y}\n40\n${rad}\n`;
                });
                dxf += `0\nENDSEC\n0\nEOF\n`;
                const blob = new Blob([dxf], { type: 'text/plain' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Neon_${textName}.dxf`;
                link.click();
                URL.revokeObjectURL(link.href);
            }

            // ----------------------------- Font loading & upload -----------------------------
            async function loadDefaultFont() {
                try {
                    const fallbackUrl = 'https://fonts.gstatic.com/ea/cairo/v2/Cairo-Regular.ttf';
                    const resp = await fetch(fallbackUrl);
                    if (resp.ok) {
                        const buffer = await resp.arrayBuffer();
                        currentFont = opentype.parse(buffer);
                        statusMsg.innerText = "✅ الخط الافتراضي (Cairo) جاهز";
                        processDesign();
                    } else throw new Error();
                } catch (e) {
                    statusMsg.innerText = "📁 يرجى رفع خط TTF/OTF لبدء التصميم";
                }
            }
            fontUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        currentFont = opentype.parse(ev.target.result);
                        statusMsg.innerText = `✅ تم تحميل الخط: ${currentFont.names?.fontFamily?.en || 'custom'}`;
                        computationCache.clear();
                        processDesign();
                    } catch (err) { alert("خطأ: الملف ليس خطاً صالحاً"); }
                };
                reader.readAsArrayBuffer(file);
            });

            // ----------------------------- BOTTOM SHEET (إصلاح كامل للفتح/الإغلاق) -----------------------------
            (function initBottomSheet() {
                const sheet = document.getElementById('bottom-sheet');
                const openBtn = document.getElementById('btn-open-sheet');
                const closeBtn = document.getElementById('btn-close-sheet');
                const handle = document.getElementById('sheet-handle');
                let sheetOpen = false;     // false = مغلق (أسفل الشاشة), true = مفتوح بالكامل
                let startY = 0, startTransY = 0, isDragging = false;
                // الحالة الأولية: مغلق (70% مترجم للأسفل)
                function setOpen(open) {
                    sheetOpen = open;
                    const translateValue = open ? '-65%' : '0%';  // 0% يعني يظهر طرف القائمة (مغلق) لكن لسلاسته : نجعله يظهر فقط مقبض
                    // لكن لتجربة أفضل: عندما نفتح نريح -65% تقريباً (يظهر المحتوى), وعند الإغلاق ننزل إلى 70% بحيث يبقى المقبض مرئياً
                    if (open) {
                        sheet.style.transform = 'translateY(-70%)';
                    } else {
                        sheet.style.transform = 'translateY(70%)';
                    }
                }
                // بداية الأزرار
                openBtn.onclick = (e) => {
                    e.stopPropagation();
                    setOpen(true);
                };
                closeBtn.onclick = (e) => {
                    e.stopPropagation();
                    setOpen(false);
                };
                // السحب بالإصبع
                handle.addEventListener('touchstart', (e) => {
                    startY = e.touches[0].clientY;
                    startTransY = sheetOpen ? -70 : 70;
                    isDragging = true;
                    sheet.style.transition = 'none';
                    e.preventDefault();
                });
                document.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    const delta = (e.touches[0].clientY - startY) / window.innerHeight * 110;
                    let newPos = startTransY + delta;
                    newPos = Math.max(-72, Math.min(80, newPos));
                    sheet.style.transform = `translateY(${newPos}%)`;
                });
                document.addEventListener('touchend', () => {
                    if (!isDragging) return;
                    isDragging = false;
                    sheet.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
                    const currentTrans = parseFloat(sheet.style.transform.match(/-?\d+/)?.[0] || 70);
                    if (currentTrans < -30) setOpen(true);
                    else setOpen(false);
                });
                setOpen(false);  // يبدأ مغلقاً
            })();

            // ----------------------------- EVENT LISTENERS and RESET -----------------------------
            function autoRegenerate() {
                clearTimeout(window._deb);
                window._deb = setTimeout(() => processDesign(), 450);
            }
            const autoInputs = ['width-cm', 'height-cm', 'hole-radius', 'hole-spacing', 'edge-offset', 'led-color', 'text-input'];
            autoInputs.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', autoRegenerate);
            });
            btnProcess.addEventListener('click', processDesign);
            btnDownload.addEventListener('click', downloadDXF);
            document.getElementById('btn-3d-reset')?.addEventListener('click', resetThreeCamera);
            initThree();
            loadDefaultFont();
            // إخفاء splash screen
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                }, 800);
            }, 2200);
        })();
    </script>
</body>
