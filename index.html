<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutaz LED Neon Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Cairo', 'Inter', system-ui, sans-serif; 
            touch-action: manipulation;
        }
        .glass { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(20px); }

        /* Bottom Sheet */
        #bottom-sheet {
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            touch-action: none;
        }
        #sheet-handle {
            width: 50px;
            height: 5px;
            background: rgba(255,255,255,0.4);
            border-radius: 9999px;
        }

        #splash-screen { transition: opacity 1.4s ease; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 overflow-hidden">

    <!-- ==================== SPLASH SCREEN - Three.js مع دوائر مضيئة ==================== -->
    <div id="splash-screen" class="fixed inset-0 z-[200] flex items-center justify-center bg-black">
        <canvas id="splash-canvas" class="absolute inset-0"></canvas>
        <div class="relative z-10 text-center">
            <h1 class="text-6xl md:text-7xl font-black tracking-widest bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-300 bg-clip-text text-transparent">
                MUTAZ
            </h1>
            <p class="text-2xl text-amber-400 mt-3 tracking-wide">LED NEON STUDIO</p>
        </div>
    </div>

    <!-- ==================== MAIN APPLICATION ==================== -->
    <div id="main-app" class="hidden flex flex-col h-screen">

        <!-- Top Header -->
        <header class="bg-slate-900 border-b border-slate-700 h-16 flex items-center px-5 fixed top-0 left-0 right-0 z-50">
            <div class="flex items-center justify-between w-full max-w-screen-2xl mx-auto">
                <div class="flex items-center gap-4">
                    <h1 id="app-title" class="text-2xl font-bold">Mutaz <span class="text-cyan-400">LED Neon</span></h1>
                </div>
                
                <div class="flex items-center gap-4">
                    <button id="lang-toggle" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-2xl font-medium text-sm">
                        <span id="current-lang">EN</span>
                    </button>
                    <button id="btn-download-dxf" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-2.5 rounded-2xl font-bold flex items-center gap-2 text-sm">
                        تحميل DXF
                    </button>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 pt-16 pb-24 overflow-hidden relative" id="preview-area">
            <!-- 2D Preview -->
            <div class="p-4">
                <h3 id="preview2d-title" class="text-lg mb-3 px-2">معاينة 2D</h3>
                <div class="bg-white rounded-3xl p-4 shadow-inner">
                    <canvas id="main-canvas" width="800" height="460" class="mx-auto rounded-2xl"></canvas>
                </div>
            </div>

            <!-- 3D Preview -->
            <div class="p-4 pt-2">
                <h3 id="preview3d-title" class="text-lg mb-3 px-2">معاينة ثلاثية الأبعاد</h3>
                <div id="three-container" class="w-full h-[380px] bg-black rounded-3xl overflow-hidden"></div>
            </div>
        </div>

        <!-- Bottom Sheet - Draggable Settings -->
        <div id="bottom-sheet" class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-600 rounded-t-3xl glass z-50 max-h-[85vh] overflow-hidden">
            
            <!-- Handle -->
            <div class="flex justify-center pt-3 pb-2">
                <div id="sheet-handle"></div>
            </div>

            <div class="px-6 pb-6 overflow-auto max-h-[calc(85vh-50px)]">
                <h2 id="settings-title" class="text-xl font-semibold text-cyan-300 mb-6">إعدادات التصميم</h2>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="font-label">رفع خط مخصص (TTF/OTF)</label>
                        <input type="file" id="font-upload" accept=".ttf,.otf" class="w-full">
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="text-label">النص (عربي / إنجليزي)</label>
                        <textarea id="text-input" rows="3" class="w-full p-4 rounded-2xl bg-slate-800 border border-slate-600 text-lg">معتز</textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1" id="width-label">العرض (سم)</label>
                            <input type="number" id="width-cm" value="100" step="5" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1" id="height-label">الارتفاع (سم)</label>
                            <input type="number" id="height-cm" value="60" step="5" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1" id="hole-radius-label">قطر الثقب (مم)</label>
                            <input type="number" id="hole-radius" value="3" step="0.2" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1" id="hole-spacing-label">التباعد (مم)</label>
                            <input type="number" id="hole-spacing" value="15" step="1" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="edge-offset-label">المسافة من الحافة (مم)</label>
                        <input type="number" id="edge-offset" value="4" step="0.5" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="led-color-label">لون الـ LED</label>
                        <input type="color" id="led-color" value="#00ffff" class="w-full h-12 rounded-2xl cursor-pointer">
                    </div>

                    <button id="btn-process" class="w-full bg-cyan-600 hover:bg-cyan-500 py-4 rounded-2xl font-bold text-lg mt-4">
                        تحديث المعاينة
                    </button>

                    <div id="progress-container" class="hidden mt-4">
                        <div class="flex justify-between text-xs mb-1">
                            <span id="progress-label">جارٍ المعالجة...</span>
                            <span id="progress-percent">0%</span>
                        </div>
                        <div class="h-2 bg-slate-700 rounded-full overflow-hidden">
                            <div id="progress-fill" class="h-full bg-gradient-to-r from-cyan-400 to-emerald-500 transition-all w-0"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script type="module" src="js/main.js"></script>

    <script>
        // ====================== SPLASH SCREEN - Glowing Circles ======================
        let scene, camera, renderer, particles;
        let time = 0;

        function initSplash() {
            const canvas = document.getElementById('splash-canvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 40;

            // Lights
            scene.add(new THREE.AmbientLight(0xaaaaaa, 0.6));
            const pointLight = new THREE.PointLight(0xffdd88, 3, 100);
            pointLight.position.set(15, 20, 30);
            scene.add(pointLight);

            // Glowing Particles (دوائر مضيئة)
            const count = 1400;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                const radius = 25 + Math.random() * 35;
                const angle = Math.random() * Math.PI * 2;
                
                positions[i]     = Math.cos(angle) * radius;
                positions[i + 1] = (Math.random() - 0.5) * 50;
                positions[i + 2] = Math.sin(angle) * radius;

                colors[i]     = 1.0;
                colors[i + 1] = 0.75 + Math.random() * 0.25;
                colors[i + 2] = 0.3 + Math.random() * 0.4;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.65,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthTest: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            animateSplash();
        }

        function animateSplash() {
            requestAnimationFrame(animateSplash);
            time += 0.008;
            particles.rotation.y = time * 0.15;
            renderer.render(scene, camera);
        }

        // ====================== Bottom Sheet Drag Logic ======================
        let startY, currentY, isDragging = false;
        const bottomSheet = document.getElementById('bottom-sheet');

        function setupBottomSheet() {
            const handle = document.getElementById('sheet-handle');

            handle.addEventListener('touchstart', e => {
                startY = e.touches[0].clientY;
                isDragging = true;
            });

            document.addEventListener('touchmove', e => {
                if (!isDragging) return;
                currentY = e.touches[0].clientY;
                let diff = currentY - startY;
                
                if (diff < -100) {
                    bottomSheet.style.transform = `translateY(-70%)`;
                } else if (diff > 100) {
                    bottomSheet.style.transform = `translateY(0)`;
                }
            });

            document.addEventListener('touchend', () => {
                isDragging = false;
            });

            // Click on handle to toggle
            handle.addEventListener('click', () => {
                const current = bottomSheet.style.transform;
                bottomSheet.style.transform = current.includes('-70%') ? 'translateY(0)' : 'translateY(-70%)';
            });
        }

        // ====================== Language Support ======================
        let currentLang = 'ar';

        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('current-lang').textContent = currentLang.toUpperCase();
        });

        // ====================== Final Initialization ======================
        window.addEventListener('load', () => {
            initSplash();

            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    setupBottomSheet();
                }, 900);
            }, 2600);
        });

        // Resize handler
        window.addEventListener('resize', () => {
            if (renderer && camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
