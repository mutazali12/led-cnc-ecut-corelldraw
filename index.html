<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mutaz LED Neon Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap');
        
        body { 
            font-family: 'Cairo', 'Inter', system-ui, sans-serif; 
            touch-action: none;
            overscroll-behavior: none;
        }
        .glass { 
            background: rgba(15, 23, 42, 0.96); 
            backdrop-filter: blur(20px); 
        }

        #bottom-sheet {
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7);
        }
        #sheet-handle {
            width: 45px;
            height: 5px;
            background: rgba(255,255,255,0.4);
            border-radius: 9999px;
        }
        #splash-screen { transition: opacity 1.6s ease; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 overflow-hidden">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 z-[200] flex items-center justify-center bg-black">
        <canvas id="splash-canvas" class="absolute inset-0"></canvas>
        <div class="relative z-10 text-center">
            <h1 class="text-6xl md:text-7xl font-black tracking-widest bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-300 bg-clip-text text-transparent">
                MUTAZ
            </h1>
            <p class="text-2xl text-amber-400 mt-3" id="splash-subtitle">LED NEON STUDIO</p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden flex flex-col h-screen">

        <!-- Top Header -->
        <header class="bg-slate-900 border-b border-slate-700 h-16 flex items-center px-5 fixed top-0 left-0 right-0 z-50">
            <h1 id="app-title" class="text-2xl font-bold">Mutaz <span class="text-cyan-400">LED Neon</span></h1>
        </header>

        <!-- Preview Area -->
        <div class="flex-1 pt-16 pb-32 overflow-auto p-4 space-y-6" id="preview-area">
            
            <!-- 2D Preview -->
            <div>
                <h3 id="preview2d-title" class="text-lg mb-3">معاينة 2D</h3>
                <div class="bg-white rounded-3xl p-4 shadow-inner">
                    <canvas id="main-canvas" width="800" height="460" class="mx-auto rounded-2xl"></canvas>
                </div>
            </div>

            <!-- 3D Preview -->
            <div>
                <h3 id="preview3d-title" class="text-lg mb-3">معاينة ثلاثية الأبعاد</h3>
                <div id="three-container" class="w-full h-[380px] bg-black rounded-3xl overflow-hidden"></div>
            </div>

            <!-- زر تحميل DXF -->
            <div class="flex justify-center pt-4">
                <button id="btn-download-dxf" 
                        class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-4 rounded-2xl font-bold flex items-center gap-3 shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" x2="12" y1="15" y2="3"/>
                    </svg>
                    تحميل DXF (CNC)
                </button>
            </div>
        </div>

        <!-- Bottom Sheet -->
        <div id="bottom-sheet" class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-600 rounded-t-3xl glass z-50">
            
            <!-- Header of Sheet -->
            <div class="flex items-center justify-between px-6 pt-4 pb-2">
                <button id="btn-close-sheet" class="text-3xl text-slate-400 hover:text-white transition">×</button>
                <div id="sheet-handle" class="cursor-grab active:cursor-grabbing"></div>
                <button id="btn-open-sheet" class="text-3xl text-cyan-400 hover:text-cyan-300 transition">+</button>
            </div>

            <div class="px-6 pb-8 overflow-auto" style="max-height: calc(82vh - 70px);">
                <h2 id="settings-title" class="text-xl font-semibold text-cyan-300 mb-6">إعدادات التصميم</h2>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="font-label">رفع خط مخصص (TTF/OTF)</label>
                        <input type="file" id="font-upload" accept=".ttf,.otf" class="w-full">
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="text-label">النص (عربي / إنجليزي)</label>
                        <textarea id="text-input" rows="3" class="w-full p-4 rounded-2xl bg-slate-800 border border-slate-600 text-lg" dir="rtl">معتز</textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm text-slate-400 mb-1" id="width-label">العرض (سم)</label>
                            <input type="number" id="width-cm" value="100" step="5" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                        <div><label class="block text-sm text-slate-400 mb-1" id="height-label">الارتفاع (سم)</label>
                            <input type="number" id="height-cm" value="60" step="5" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm text-slate-400 mb-1" id="hole-radius-label">قطر الثقب (مم)</label>
                            <input type="number" id="hole-radius" value="3" step="0.2" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                        <div><label class="block text-sm text-slate-400 mb-1" id="hole-spacing-label">التباعد (مم)</label>
                            <input type="number" id="hole-spacing" value="15" step="1" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="edge-offset-label">المسافة من الحافة (مم)</label>
                        <input type="number" id="edge-offset" value="4" step="0.5" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-600">
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-1" id="led-color-label">لون الـ LED</label>
                        <input type="color" id="led-color" value="#00ffff" class="w-full h-12 rounded-2xl cursor-pointer">
                    </div>

                    <button id="btn-process" class="w-full bg-cyan-600 hover:bg-cyan-500 py-4 rounded-2xl font-bold text-lg mt-6">
                        تحديث المعاينة
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script type="module" src="js/main.js"></script>

    <script>
        // ====================== SPLASH SCREEN ======================
        let scene, camera, renderer, particles, time = 0;

        function initSplash() {
            const canvas = document.getElementById('splash-canvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 42;

            scene.add(new THREE.AmbientLight(0xaaaaaa, 0.7));
            const light = new THREE.PointLight(0xffdd88, 3.8, 100);
            light.position.set(10, 25, 35);
            scene.add(light);

            const count = 1600;
            const pos = new Float32Array(count * 3);
            const col = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                const r = 28 + Math.random() * 40;
                const a = Math.random() * Math.PI * 2;
                pos[i] = Math.cos(a) * r;
                pos[i+1] = (Math.random() - 0.5) * 60;
                pos[i+2] = Math.sin(a) * r;

                col[i] = 1.0; col[i+1] = 0.8; col[i+2] = 0.4;
            }

            particles = new THREE.Points(
                new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pos, 3))
                                      .setAttribute('color', new THREE.BufferAttribute(col, 3)),
                new THREE.PointsMaterial({ size: 0.75, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true })
            );
            scene.add(particles);
            animateSplash();
        }

        function animateSplash() {
            requestAnimationFrame(animateSplash);
            time += 0.01;
            particles.rotation.y = time * 0.2;
            renderer.render(scene, camera);
        }

        // ====================== BOTTOM SHEET ======================
        let sheetTranslate = 0; // 0 = closed, -70 = open

        function setupBottomSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const handle = document.getElementById('sheet-handle');

            let startY = 0;
            let isDragging = false;

            // Buttons
            document.getElementById('btn-close-sheet').addEventListener('click', () => {
                sheetTranslate = 0;
                sheet.style.transform = `translateY(0%)`;
            });

            document.getElementById('btn-open-sheet').addEventListener('click', () => {
                sheetTranslate = -70;
                sheet.style.transform = `translateY(-70%)`;
            });

            // Drag Logic (محسن)
            handle.addEventListener('touchstart', e => {
                startY = e.touches[0].clientY;
                isDragging = true;
                sheet.style.transition = 'none';
            });

            document.addEventListener('touchmove', e => {
                if (!isDragging) return;
                const diff = (e.touches[0].clientY - startY) / window.innerHeight * 110;
                let newPos = sheetTranslate + diff;
                newPos = Math.max(-85, Math.min(10, newPos));
                sheet.style.transform = `translateY(${newPos}%)`;
            });

            document.addEventListener('touchend', () => {
                if (!isDragging) return;
                isDragging = false;
                sheet.style.transition = 'transform 0.4s cubic-bezier(0.32, 0.72, 0, 1)';

                if (sheetTranslate > -35) {
                    sheetTranslate = 0;
                } else {
                    sheetTranslate = -70;
                }
                sheet.style.transform = `translateY(${sheetTranslate}%)`;
            });

            // Initial state: Peek mode (يظهر طرف القائمة)
            setTimeout(() => {
                sheet.style.transform = `translateY(0%)`;
            }, 500);
        }

        // ====================== Language ======================
        let currentLang = 'ar';

        const translations = {
            ar: { /* ... نفس الترجمات السابقة ... */ },
            en: { /* ... نفس الترجمات السابقة ... */ }
        };

        function switchLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('current-lang').textContent = currentLang.toUpperCase();
            // يمكن توسيعها لاحقاً
        }

        // ====================== Init ======================
        window.addEventListener('load', () => {
            initSplash();

            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    setupBottomSheet();
                }, 800);
            }, 2300);

            document.getElementById('lang-toggle').addEventListener('click', switchLanguage);
        });
    </script>
</body>
</html>
